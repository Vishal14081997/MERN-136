<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div id="container">
        <div id="main">
            <div id="input-box">
                <div id="search-input">
                    <input type="text" placeholder="Search..." id="input">
                    <button id="search-button">
                        <!-- <img src="./image/search-icon-png-5-removebg-preview.png" alt="" height="20" width="20"
                            id="search-icon"> -->
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

            </div>
            <div id="middle">
                <div id="left">
                    <p id="city-name">Jaipur</p>
                    <p id="current-date">21-aug-2026</p>
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPrSm90sRnFqKHdrSYSmzwG0ygmaKu3HMqhqZRmEWnGQ&s=10"
                        height="50" width="50" alt="" id="weather-image">
                </div>
                <div id="right">
                    <p id="current-temp">21<sup>o</sup>C</p>
                    <p id="min-max-temp">21<sup>o</sup>C/21<sup>o</sup>C</p>
                </div>
            </div>
            <div id="lower">
                <div id="inner"></div>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
